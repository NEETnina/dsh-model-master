name: Bug 报告
description: 插件行为不对、面板打不开、测速结果可疑……请在这里报
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。为了让问题可复现，请尽量填全下面几项 —— 尤其是**插件版本**和**复现步骤**。
        > 提交前请确认：已重启过 DSH（或等 HMR 重载）、已确认问题在关闭本插件后消失。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 'package.json 里的 version，或面板顶栏看到的版本号'
      placeholder: '1.1.2'
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本 / Node 版本
      description: DSH 的版本号与 `node -v` 的输出
      placeholder: 'dsh 0.2.x / node v22.x'
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - DSH Web
        - DSH 桌面版
        - 其他（请在正文说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，越具体越好
      placeholder: |
        1. 打开面板
        2. 点某个模型的「测」
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 控制台报错、`$DSH_HOME/model-master/` 下的相关文件片段都可以贴在这里
    validations:
      required: false
