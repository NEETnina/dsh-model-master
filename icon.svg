<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="模型选择大师">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- M 的四笔；中央 V 向下延出成箭头，一个形状两种读法 -->
  <g stroke="#FFFFFF" stroke-width="21" stroke-linecap="round" fill="none">
    <path d="M48 130 V58"/>
    <path d="M48 58 L90 106"/>
    <path d="M90 106 L132 58"/>
    <path d="M132 58 V130"/>
  </g>
  <path d="M79 100 L90 150 L101 100 Z" fill="#FFFFFF"/>
</svg>